apiVersion: apps/v1
kind: Deployment
metadata:
  name: springapp-home
  namespace: springapp-home
  labels:
    app: springapp-home
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springapp-home
  template:
    metadata:
      labels:
        app: springapp-home
    spec:
      containers:
        - name: springapp-home
          # Replace engrsharvan1 with your Docker Hub username
          image: engrsharvan1/springapp-home:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/paymentdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          envFrom:
            - configMapRef:
                name: springapp-home-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
