apiVersion: apps/v1
kind: Deployment
metadata:
  name: springapp-home
  namespace: springapp-home
  labels:
    app: springapp-home
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springapp-home
  template:
    metadata:
      labels:
        app: springapp-home
    spec:
      containers:
        - name: springapp-home
          image: engrsharvan1/springapp-home:b72633d62d32e36b656390e264a875a926eb2123
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/paymentdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
          envFrom:
            - configMapRef:
                name: springapp-home-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "768Mi"
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
