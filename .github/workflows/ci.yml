name: CI - Build and Push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/springapp-home:${{ github.sha }} .

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/springapp-home:${{ github.sha }}

      - name: Update image tag in k8s manifest
        run: |
          sed -i "s|image:.*springapp-home.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/springapp-home:${{ github.sha }}|g" k8s/deployment.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add k8s/deployment.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          git pull --rebase
          git push
